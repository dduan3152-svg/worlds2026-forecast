name: Refresh private forecast
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: private-forecast-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check tournament window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%Y%m%d)" < "20261116" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Fetch licensed data and update conditional forecast
        if: steps.window.outputs.active == 'true'
        id: forecast
        continue-on-error: true
        run: python src/live_forecast.py --fetch
      - name: Validate history, export and privacy
        if: steps.window.outputs.active == 'true'
        run: python src/check_live.py
      - name: Preserve immutable versions and save latest results
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          if git diff --name-only --diff-filter=MD -- live/history/ | read -r changed; then
            echo 'Refusing to change a historical forecast.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live/history live/status.json live/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update forecast check and preserve new prediction versions'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: steps.window.outputs.active == 'true'
        with:
          name: private-forecast-results
          path: live/
          retention-days: 7
      - name: Report source failure
        if: steps.forecast.outcome == 'failure'
        run: exit 1
