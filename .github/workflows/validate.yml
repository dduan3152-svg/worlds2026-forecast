name: Validate frozen forecast

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify snapshot and exercise simulator
        run: python src/check_repository.py
      - name: Test live source adapter and versioning
        run: python -m unittest discover -s tests -v
      - name: Check website and version history
        run: python src/check_live.py
      - name: Keep historical forecasts append-only
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only --diff-filter=MD HEAD^ HEAD -- live/history/ | read -r changed; then
              echo 'Historical forecasts must not be modified or deleted.' >&2
              exit 1
            fi
          fi
